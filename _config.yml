locale: en-US
title: Notes
description: Matt's Reference Links

url: "https://notes.matthimrod.com"
baseurl: ""

plugins:
  - jekyll-feed

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    guess_lang: true

include: ["_pages"]
permalink: /:title/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      toc: true
      classes: wide

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - vendor/
  - .gitea/
