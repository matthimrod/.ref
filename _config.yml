remote_theme: "mmistakes/minimal-mistakes@4.28.1"

plugins:
  - jekyll-remote-theme
  
title: Notes (GitHub Version)
description: Matt's Reference Links

url: "https://ref.matthimrod.com"
baseurl: ""

minimal_mistakes_skin: "dark"
show_downloads: false
enable_copy_code_button: true
include: ["_pages"]

defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      toc: true
      toc_sticky: false
      sidebar:
        - nav: "side"
