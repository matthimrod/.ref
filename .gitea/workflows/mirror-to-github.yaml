name: Sync to GitHub

on:
  push:
    branches:
      - main

env:
  GITHUB_USER: "matthimrod"
  GITHUB_REPO: ".ref"

jobs:
  sync:
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:full-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push to GitHub via SSH
        env:
          GITHUB_SSH_KEY: ${{ secrets.GITHUB_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$GITHUB_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          git remote add github git@github.com:${{ env.GITHUB_USER }}/${{ env.GITHUB_REPO }}.git || true
          
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            git push github HEAD:${{ github.ref_name }} --force-with-lease