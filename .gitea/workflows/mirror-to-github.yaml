name: Sync to GitHub

on:
  push:
    branches:
      - main

env:
  GITHUB_USER: "matthimrod"
  GITHUB_REPO: ".ref"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Push to GitHub via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          cd ${{ github.workspace }}

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          if [ -f .git/shallow ]; then
            git fetch --unshallow || true
          fi
          
          git remote add github git@github.com:${{ env.GITHUB_USER }}/${{ env.GITHUB_REPO }}.git
          
          GIT_SSH_COMMAND="ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            git push github HEAD:${{ github.ref_name }} --force-with-lease