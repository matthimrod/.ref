name: Sync to GitHub

on:
  push:
    branches:
      - main

env:
  GITHUB_USER: "matthimrod"
  GITHUB_REPO: ".ref"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Push to GitHub via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts

          if [ -f .git/shallow ]; then
            git fetch --unshallow github || true
          fi

          git remote add github git@github.com:${{ env.GITHUB_USER }}/${{ env.GITHUB_REPO }}.git

          git push github main --force-with-lease