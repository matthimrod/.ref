---
layout: default
---
<article class="note-page {% if page.classes %}{{ page.classes }}{% endif %}">
  <header class="note-header">
    {% if page.url != '/' %}
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="{{ '/' | relative_url }}">Notes</a>
      <span class="breadcrumb-sep">/</span>
      <span class="breadcrumb-current">{{ page.title }}</span>
    </nav>
    {% endif %}
    <h1 class="note-title">{{ page.title }}</h1>
  </header>

  {% if page.toc != false %}
  <nav id="auto-toc" class="toc-box" aria-label="Table of contents" hidden>
    <div class="toc-header">
      <span class="toc-label">
        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        Contents
      </span>
      <button type="button" class="toc-toggle" aria-expanded="true" title="Collapse / Expand Table of Contents">
        <span class="toc-toggle-indicator">−</span>
      </button>
    </div>
    <div class="toc-body">
      <ul class="toc-list" id="toc-list"></ul>
    </div>
  </nav>
  {% endif %}

  <div class="note-body">
    {{ content }}
  </div>
</article>
