<!DOCTYPE html>
<html lang="{{ site.locale | default: 'en-US' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% assign page_title = page.title %}
  <title>{% if page_title and page.url != '/' %}{{ page_title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  
  <script>
    (function() {
      const storedTheme = localStorage.getItem('notes_theme');
      if (storedTheme) {
        document.documentElement.setAttribute('data-theme', storedTheme);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body class="layout-{{ page.layout | default: 'default' }}">
  <a class="skip-link" href="#main-content">Skip to content</a>

  {% include header.html %}

  <div class="site-container">
    {% include sidebar.html %}

    <div class="site-content-area">
      <main id="main-content" class="site-main" role="main">
        {{ content }}
      </main>

      {% include footer.html %}
    </div>
  </div>

  <script src="{{ '/assets/js/notes.js' | relative_url }}" defer></script>
</body>
</html>
